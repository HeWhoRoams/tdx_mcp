name: Release bundle

on:
  release:
    types: [published]

# Default-deny: the job declares exactly what it needs.
permissions: {}

jobs:
  bundle:
    name: Build and attach the desktop extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:sensitive
      - run: npm run check:package
      - run: npm run pack:mcpb

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/*.mcpb --clobber
