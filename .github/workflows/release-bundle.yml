name: Release bundle

on:
  release:
    types: [published]

# Default-deny: the job declares exactly what it needs.
permissions: {}

jobs:
  bundle:
    name: Build and attach the desktop extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:sensitive
      - run: npm run check:package
      - run: npm run pack:mcpb

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/*.mcpb --clobber
